[pytest]
asyncio_mode = auto
markers =
    assist_eval: offline live-assist quality benchmark (real provider calls; run explicitly with `pytest -m assist_eval`)
; The eval suite costs real model calls, so it never runs by default (CI runs
; `pytest -q`). A command-line `-m assist_eval` overrides this addopts filter.
addopts = -m "not assist_eval"
